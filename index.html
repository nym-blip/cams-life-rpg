<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Cam's Life RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111f,#050b14);color:#f7f4ea;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
.app{max-width:720px;margin:auto;padding:8px 10px 90px}.top{height:58px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid #29405f;text-align:center}.top button{background:none;border:0;color:#e5b83d;font-size:24px}.top h1{font-size:22px;margin:0}.card{background:#0b1729;border:1px solid #29446a;border-radius:20px;padding:14px;margin-top:10px;box-shadow:0 12px 30px #0004}.hero{display:grid;grid-template-columns:40% 60%;gap:12px;border-color:#d9a52d}.portrait{aspect-ratio:1/1.18;border:3px solid #e5b83d;border-radius:16px;background:#07316e;display:grid;place-items:center;font-size:70px}.name{font-size:38px;font-weight:950}.badge{margin-top:8px;border:2px solid #e5b83d;border-radius:12px;padding:7px;text-align:center;color:#f3d071;font-size:11px;font-weight:900}.xphead{display:flex;justify-content:space-between;margin-top:15px;font-weight:900}.star{color:#ffd14a;font-size:22px}.bar{height:11px;background:#101d31;border:1px solid #31496d;border-radius:99px;margin:7px 0;overflow:hidden}.fill{height:100%;background:#934cff}.center{text-align:center;font-size:12px;color:#cdd3df}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pill{border:1px solid #2f4b72;border-radius:13px;padding:8px;text-align:center;font-weight:900}.pill small{display:block;color:#aab5c7;font-size:10px}.save{text-align:center;color:#38e47d;font-size:11px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section h2{font-size:15px;margin:0 0 8px}.row{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;padding:10px 0;border-top:1px solid #1c2e48;font-size:12px}.row:first-child{border-top:0}.icon{font-size:19px}.value{font-weight:950;font-size:15px}.title-head{font-weight:950;margin-bottom:9px}.titles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.title{min-height:90px;border:1px solid #36557f;border-radius:13px;background:#0c192c;color:#f7f4ea;padding:8px 4px;font-weight:800}.title.equipped{border:2px solid #e5b83d;background:#382d18}.title.locked{opacity:.45}.ti{font-size:23px}.tn{font-size:10px;line-height:1.1}.stars{font-size:10px;color:#dce3ef}.bottom{position:fixed;bottom:0;left:0;right:0;background:#06101c;border-top:1px solid #29405f;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.nav{background:none;border:0;color:#91a0b7;font-size:10px;font-weight:800}.nav b{display:block;font-size:20px}.nav.active{color:#f0bf36}
</style></head><body><div class="app">
<header class="top"><button>☰</button><h1>👑 Character</h1><button>⚙️</button></header>
<section class="card hero"><div class="portrait">🧑🏾‍🦱</div><div><div class="name">Cam</div><div class="badge">LEVEL <span id="level">1</span> • <span id="title">BEGINNER ADVENTURER</span></div>
<div class="xphead"><span><span class="star">★</span> Lifetime XP</span><span id="xp">0 XP</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="center"><span id="cur">0</span> / 50 XP to next level</div>
<div class="meta"><div class="pill">🪙 <span id="coins">0</span><small>Coins</small></div><div class="pill">🔥 <span id="streak">0</span><small>Day Streak</small></div></div><div class="save">● Saved</div></div></section>
<div class="grid"><section class="card section"><h2>📊 ATTRIBUTES</h2><div id="stats"></div></section><section class="card section"><h2>🏆 ADVENTURE STATS</h2><div id="adv"></div></section></div>
<section class="card"><div class="title-head">👑 TITLES</div><div class="titles" id="titles"></div></section></div>
<nav class="bottom"><button class="nav">⌂<b>Home</b></button><button class="nav active">●<b>Character</b></button><button class="nav">☷<b>Quests</b></button><button class="nav">♜<b>Shop</b></button><button class="nav">🏆<b>Achievements</b></button></nav>
<script>
const key="camRpgSave";let s={totalXp:0,coins:0,streak:0,totalCompleted:0,stats:{strength:0,selfcare:0,nutrition:0,environment:0},equippedTitle:"Beginner Adventurer"};try{s=Object.assign(s,JSON.parse(localStorage.getItem(key)||"{}"))}catch(e){}
const meta={strength:["💪","Strength"],selfcare:["💜","Self-Care"],nutrition:["🍎","Nutrition"],environment:["🏠","Environment"]};
const ts=[[0,"👑","Beginner Adventurer","★"],[50,"⚔️","Rising Adventurer","★★"],[250,"🛡️","Seasoned Adventurer","★★★"],[500,"🔥","Veteran Adventurer","★★★★"],[1000,"👑","Elite Adventurer","★★★★★"],[2450,"👑","Master Adventurer","★★★★★"]];
const lvl=Math.floor(s.totalXp/50)+1,cur=s.totalXp%50;document.getElementById("level").textContent=lvl;document.getElementById("xp").textContent=s.totalXp+" XP";document.getElementById("cur").textContent=cur;document.getElementById("fill").style.width=cur*2+"%";document.getElementById("coins").textContent=s.coins;document.getElementById("streak").textContent=s.streak;document.getElementById("title").textContent=(s.equippedTitle||"Beginner Adventurer").toUpperCase();
document.getElementById("stats").innerHTML=Object.entries(meta).map(([k,v])=>`<div class="row"><div class="icon">${v[0]}</div><div>${v[1]}</div><div class="value">${s.stats[k]||0}</div></div>`).join("");
document.getElementById("adv").innerHTML=[["📋","Quests Completed",s.totalCompleted],["🔥","Current Streak",s.streak],["🏆","Achievements",s.totalCompleted>0?1:0],["🪙","Coins Earned",s.coins]].map(x=>`<div class="row"><div class="icon">${x[0]}</div><div>${x[1]}</div><div class="value">${x[2]||0}</div></div>`).join("");
document.getElementById("titles").innerHTML=ts.map(t=>{let u=s.totalXp>=t[0],e=s.equippedTitle===t[2];return `<button class="title ${e?"equipped":""} ${u?"":"locked"}" ${u?`onclick="equip('${t[2]}')"`:"disabled"}><div class="ti">${u?t[1]:"🔒"}</div><div class="tn">${t[2]}</div><div class="stars">${t[3]}</div></button>`}).join("");
function equip(n){s.equippedTitle=n;localStorage.setItem(key,JSON.stringify(s));location.reload()}
</script></body></html>
